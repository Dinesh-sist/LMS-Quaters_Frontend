image: node:20

stages:
  - install
  - lint
  - build

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

install:
  stage: install
  script:
    - echo "Dependencies installed"

lint:
  stage: lint
  script:
    - npm run lint

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week